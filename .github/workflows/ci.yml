name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    timeout-minutes: 60
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: test
            run: bun run test:coverage
          - task: lint
            run: |
              bun run lint:check
              bash scripts/check-comment-budget.sh 15
              bun run check:images
          - task: knip
            run: bun --bun knip --no-progress
          - task: typecheck
            run: bun --bun astro check
          - task: build
            run: |
              bun run build
              bun run test:dist
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        env:
          PUBLIC_SITE_URL: https://blog.blahaj.uk
        run: ${{ matrix.run }}

      - name: Deploy to Cloudflare
        if: ${{ matrix.task == 'build' && github.event_name == 'push' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --cwd deploy cf deploy

      - name: Upload coverage to Codecov
        if: ${{ always() && matrix.task == 'test' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: contract
          fail_ci_if_error: false
