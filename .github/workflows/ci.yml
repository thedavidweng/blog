name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: test
            run: pnpm test:coverage
          - task: lint
            run: |
              pnpm lint:check
              bash scripts/check-comment-budget.sh 15
              pnpm check:images
          - task: knip
            run: pnpm knip --no-progress
          - task: typecheck
            run: pnpm exec astro check
          - task: build
            run: |
              pnpm build
              pnpm test:dist
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: ${{ matrix.run }}

      - name: Upload coverage to Codecov
        if: ${{ always() && matrix.task == 'test' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: contract
          fail_ci_if_error: false
