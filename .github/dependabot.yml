version: 2
updates:
  # Enable npm/pnpm dependency tracking
  - package-ecosystem: "npm"
    groups:
      non-major:
        update-types:
          - "minor"
          - "patch"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Automatically add labels to PRs
    labels:
      - "dependencies"
    # Commit message conventions
    commit-message:
      prefix: "chore"
      include: "scope"

  # Keep GitHub Actions up to date (if you ever add any)
    cooldown:
      default-days: 7
      semver-major-days: 10
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
